name: Scheduled jobs

# Runs the app's background jobs on a schedule, independent of whichever
# host actually serves vanovahub.com - originally these ran as Vercel
# Cron, but Hostinger's Node.js hosting has no cron feature at all, so
# GitHub Actions does the scheduling instead and just hits the same
# routes over HTTPS (all times UTC, cron's native timezone). No longer
# tied to vercel.json's old schedule (that file's gone - see its own
# removal commit) - two of these six now run far more often than the
# original once-daily-only design allowed, see the schedule comments
# below for why.
#
# Calls /api/internal-task?job=<name>, not the 6 dedicated /api/scheduled/*
# routes directly - confirmed live those are blocked at Hostinger's edge
# (Server: hcdn, flat 403 before the request ever reaches the app or any
# access log), independent of the route's name, CDN security level, or
# vercel.json (all ruled out one at a time). A single consolidated,
# query-param-driven endpoint gets past whatever's actually triggering it.
# A real fix (Hostinger allowlisting /api/scheduled/*) is tracked as a
# separate support ticket; this workaround stays regardless of that outcome.
on:
  schedule:
    # send-owner-reminders and timeout-owner-reviews run every 15 minutes,
    # not daily like the other four - both deal with a specific moment in
    # time (a reminder set for "2pm today", a 1-hour owner-review SLA -
    # see lib/... STALE_AFTER_MS), and a once-daily check meant either
    # could run up to ~23 hours late. The other four (a 24h reminder
    # window, a weekly digest, a multi-day-out billing warning, a nightly
    # demo reset) don't have that problem - daily already lines up with
    # what they're actually checking. GitHub Actions is free regardless of
    # frequency (unlike Vercel Hobby's daily-only cron limit this was
    # originally designed around), so there's no cost reason to hold these
    # two back anymore.
    - cron: '*/15 * * * *' # send-owner-reminders + timeout-owner-reviews - every 15 min
    - cron: '0 8 * * *'    # send-reminders - daily 08:00 UTC
    - cron: '0 8 * * 1'    # weekly-insights - Mondays 08:00 UTC
    - cron: '0 9 * * *'    # billing-warnings - daily 09:00 UTC
    - cron: '0 3 * * *'    # reset-demo-data - daily 03:00 UTC
  workflow_dispatch: {} # allows manually triggering all jobs from the Actions tab, for testing

jobs:
  run-due-job:
    runs-on: ubuntu-latest
    steps:
      - name: Call the routes matching this trigger's schedule
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # A schedule string alone can no longer pick a single route -
          # send-owner-reminders and timeout-owner-reviews now share the
          # identical '*/15 * * * *' entry, so this maps to a (possibly
          # multi-item) list of routes instead of one.
          case "${{ github.event.schedule }}" in
            '*/15 * * * *') ROUTES="send-owner-reminders timeout-owner-reviews" ;;
            '0 8 * * *')    ROUTES="send-reminders" ;;
            '0 8 * * 1')    ROUTES="weekly-insights" ;;
            '0 9 * * *')    ROUTES="billing-warnings" ;;
            '0 3 * * *')    ROUTES="reset-demo-data" ;;
            *) echo "Manual run - hitting all routes"
               ROUTES="send-owner-reminders send-reminders weekly-insights billing-warnings timeout-owner-reviews reset-demo-data" ;;
          esac

          # Confirmed live via the Actions run logs: three separate failures
          # (different days, different jobs - send-owner-reminders twice,
          # send-reminders once) all showed the exact same shape - curl exit
          # code 28 (operation timeout) after ~4m31s, with no HTTP status at
          # all, not a fast 4xx/5xx. That isn't this route's own logic
          # failing; it's the request getting no response whatsoever, most
          # likely landing during one of Hostinger's app-process restarts
          # (this repo pushes to main, and therefore redeploys, many times a
          # day) with nothing on that path to fail fast. Two real fixes:
          # --max-time caps a hang at 60s instead of silently burning ~4.5
          # minutes of runner time with no visibility until the network
          # layer itself gives up; --retry gives a request that lands in
          # exactly that restart window a second try a few seconds later,
          # which should succeed once the app is back.
          FAILED=""

          hit() {
            echo "GET https://vanovahub.com/api/internal-task?job=$1"
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              --max-time 60 --retry 2 --retry-delay 10 --retry-all-errors \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "https://vanovahub.com/api/internal-task?job=$1") || status="000"
            echo "-> $status"
            if [ "$status" -ge 400 ] || [ "$status" = "000" ]; then FAILED="$FAILED $1"; fi
          }

          for r in $ROUTES; do
            hit "$r"
          done

          # One job failing (or hanging) must never silently take the rest
          # of this run's jobs down with it - the previous `exit 1` inside
          # hit() meant the FIRST route to fail killed the whole script, so
          # send-owner-reminders hanging also meant timeout-owner-reviews,
          # scheduled in the exact same 15-minute batch right after it,
          # never even got attempted. Every route above always gets tried
          # now; this only fails the Action (so a real failure is still
          # visible as a red run) once every route has had its turn.
          if [ -n "$FAILED" ]; then
            echo "Failed:$FAILED"
            exit 1
          fi
